# This is the name of the workflow that will be displayed in the Actions tab
name: CICD

# Manual click (deliver) workflow whenever the user needs it.
on:
  workflow_dispatch:

jobs:

# Every job needs a separate runner; this is called parallelism
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "Code Clone from GitHub"
        
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Container
        run: echo "Docker Container build"
        
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing the container"
        
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the app
        run: echo "Docker Compose deployed the app"
  
